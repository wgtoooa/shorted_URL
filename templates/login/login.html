
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: white;
            --text-color: #343a40;
            --input-bg: white;
            --input-border: #ccc;
            --button-bg: #17a2b8;
            --button-hover: #138496;
            --link-color: #17a2b8;
            --error-color: #dc3545;
        }

        .dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --button-bg: #1a7f8c;
            --button-hover: #136674;
            --link-color: #4fc3f7;
            --error-color: #e57373;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color); /* Убрал градиент */
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .card {
            background: var(--container-bg);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 0.5rem 0;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .button {
            display: block;
            width: 100%;
            background-color: var(--button-bg);
            color: white;
            padding: 12px;
            margin-top: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .button:hover {
            background-color: var(--button-hover);
        }

        .links {
            margin-top: 1rem;
            font-size: 14px;
        }

        .links a {
            color: var(--link-color);
            text-decoration: none;
            margin: 0 0.5rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            margin-top: 10px;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            display: block;
            opacity: 1;
        }
        .theme-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            padding: 8px 12px;
            background: var(--button-bg);
            color: white;
            border-radius: 20px;
            font-size: 14px;
            border: none;
            transition: all 0.3s ease;
        }

        .theme-switcher:hover {
            background: var(--button-hover);
        }
    </style>
</head>
<body>
<div class="card">
    <button class="theme-switcher" id="themeSwitcher">Dark Mode🌙</button>
    <h2>Login</h2>
    <form id="loginForm">
        <input type="text" name="login" placeholder="Login" required />
        <input type="password" name="password" placeholder="Password" required />
        <div id="errorMessage" class="error-message" aria-live="assertive"></div>
        <button type="submit" class="button">Sign In</button>
    </form>

    <div class="links">
        <a href="/">← Back</a> |
        <a href="/register">Don't have an account?</a>
    </div>
</div>

<script>
    // Theme switching functionality
    const themeSwitcher = document.getElementById('themeSwitcher');
    const body = document.body;

    // Check saved theme in localStorage
    const currentTheme = localStorage.getItem('theme') || 'light';

    if (currentTheme === 'dark') {
        body.classList.add('dark-mode');
        themeSwitcher.textContent = 'Light Mode☀️';
    }

    themeSwitcher.addEventListener('click', () => {
        body.classList.toggle('dark-mode');

        if (body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
            themeSwitcher.textContent = 'Light Mode☀️';
        } else {
            localStorage.setItem('theme', 'light');
            themeSwitcher.textContent = 'Dark Mode🌙';
        }
    });
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const errorElement = document.getElementById('errorMessage');
        errorElement.textContent = '';
        errorElement.classList.remove('show');

        try {
            const response = await fetch('/login', {
                method: 'POST',
                body: new FormData(this),
                headers: { 'Accept': 'application/json' },
                credentials: 'include' // Важно для работы с cookies
            });

            // Проверяем Content-Type ответа
            const contentType = response.headers.get('content-type');
            let result;

            if (contentType && contentType.includes('application/json')) {
                result = await response.json();
            } else {
                // Если ответ не JSON, обрабатываем как текст/HTML
                const text = await response.text();

                if (response.ok) {
                    // Если статус 200, но не JSON - вероятно, это редирект через HTML
                    window.location.href = '/url';
                    return;
                }

                // Пытаемся найти ошибку в HTML (если это страница с ошибкой)
                const errorMatch = text.match(/<div class="error">(.*?)<\/div>/i);
                errorElement.textContent = errorMatch ? errorMatch[1] : 'Неизвестная ошибка сервера';
                errorElement.classList.add('show');
                return;
            }

            if (!response.ok) {
                // Обработка JSON-ошибок от сервера
                errorElement.textContent = result.error || result.message || 'Ошибка авторизации';
                errorElement.classList.add('show');
                return;
            }

            // Успешная авторизация
            window.location.href = result.redirect || '/url"';

        } catch (error) {
            console.error('Login error:', error);

            let errorMessage;
            if (error instanceof TypeError) {
                errorMessage = 'Нет соединения с сервером';
            } else if (error instanceof SyntaxError) {
                errorMessage = 'Сервер вернул некорректные данные';
            } else {
                errorMessage = 'Произошла неизвестная ошибка';
            }

            errorElement.textContent = errorMessage;
            errorElement.classList.add('show');

            // Автоскрытие через 5 сек
            setTimeout(() => errorElement.classList.remove('show'), 5000);
        }

    });
</script>
</body>
</html>
