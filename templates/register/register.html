<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: white;
            --text-color: #343a40;
            --input-bg: white;
            --input-border: #ccc;
            --button-bg: #17a2b8;
            --button-hover: #138496;
            --link-color: #17a2b8;
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        .dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --button-bg: #1a7f8c;
            --button-hover: #136674;
            --link-color: #4fc3f7;
            --error-color: #e57373;
            --success-color: #81c784;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color); /* Убрали градиент */
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .card {
            background: var(--container-bg);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 0.5rem 0;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .button {
            display: block;
            width: 100%;
            background-color: var(--button-bg);
            color: white;
            padding: 12px;
            margin-top: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .button:hover {
            background-color: var(--button-hover);
        }

        .links {
            margin-top: 1rem;
            font-size: 14px;
        }

        .links a {
            color: var(--link-color);
            text-decoration: none;
            margin: 0 0.5rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 4px;
            display: none;
        }

        .error-message {
            color: var(--error-color);
            margin-top: 10px;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            display: block;
            opacity: 1;
        }

        .success {
            background-color: color-mix(in srgb, var(--success-color) 20%, transparent);
            color: var(--success-color);
            display: block;
        }

        .theme-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            padding: 8px 12px;
            background: var(--button-bg);
            color: white;
            border-radius: 20px;
            font-size: 14px;
            border: none;
            transition: all 0.3s ease;
        }

        .theme-switcher:hover {
            background: var(--button-hover);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-color);
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="card">
    <button class="theme-switcher" id="themeSwitcher">Dark Mode🌙</button>
    <h2>Register</h2>
    <form id="registerForm">
        <input type="text" name="login" id="username" placeholder="Username" required minlength="3" />
        <div class="password-container">
            <input type="password" name="password" id="password" placeholder="Password" required minlength="6" />
            <span class="password-toggle" id="togglePassword">👁️</span>
        </div>
        <div id="message" class="message"></div>
        <div id="errorMessage" class="error-message" aria-live="assertive"></div>
        <button type="submit" class="button">Register</button>
    </form>

    <div class="links">
        <a href="/">← Back</a> |
        <a href="/login">Already have an account?</a>
    </div>
</div>

<script>
    // Theme switching functionality
    const themeSwitcher = document.getElementById('themeSwitcher');
    const body = document.body;

    // Check saved theme in localStorage
    const currentTheme = localStorage.getItem('theme') || 'light';

    if (currentTheme === 'dark') {
        body.classList.add('dark-mode');
        themeSwitcher.textContent = 'Light Mode☀️';
    }

    themeSwitcher.addEventListener('click', () => {
        body.classList.toggle('dark-mode');

        if (body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
            themeSwitcher.textContent = 'Light Mode☀️';
        } else {
            localStorage.setItem('theme', 'light');
            themeSwitcher.textContent = 'Dark Mode🌙';
        }
    });

    // Password toggle visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
    });

    // Form submission handling
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const form = e.target;
        const errorEl = document.getElementById('errorMessage');
        errorEl.textContent = '';
        errorEl.classList.remove('show');

        try {
            const formData = new FormData(form);
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: formData.get('login'),
                    password: formData.get('password')
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Registration failed');
            }

            // Успешная регистрация
            window.location.href = result.redirect || '/login'; // Перенаправление клиентом

        } catch (error) {
            errorEl.textContent = error.message;
            errorEl.classList.add('show');

            // Автоскрытие ошибки через 5 сек
           
        }
    });

    // Input validation
    document.getElementById('username').addEventListener('input', function() {
        if (this.value.length < 3 && this.value.length > 0) {
            this.setCustomValidity('Username must be at least 3 characters');
        } else {
            this.setCustomValidity('');
        }
    });

    document.getElementById('password').addEventListener('input', function() {
        if (this.value.length < 6 && this.value.length > 0) {
            this.setCustomValidity('Password must be at least 6 characters');
        } else {
            this.setCustomValidity('');
        }
    });
</script>
</body>
</html>
