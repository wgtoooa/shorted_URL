<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Страница не найдена</title>
    <link rel="stylesheet" href="../../static/notFound/style.css" />
</head>
<body>
<div class="container-404">
    <button class="theme-switcher" id="themeSwitcher">Тёмная тема</button>

    <div class="content-404">
        <div class="error-code">404</div>
        <h1>Упс! Страница не найдена</h1>
        <p>Похоже, мы не можем найти страницу, которую вы ищете. Возможно, она была перемещена или удалена.</p>

        <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path fill="var(--error-color)" d="M100 20c44.1 0 80 35.9 80 80s-35.9 80-80 80-80-35.9-80-80 35.9-80 80-80zm0 10c-38.7 0-70 31.3-70 70s31.3 70 70 70 70-31.3 70-70-31.3-70-70-70z"/>
            <path fill="var(--error-color)" d="M65 65l70 70m0-70l-70 70"/>
        </svg>

        <div class="buttons-container">
            <a href="/" class="btn-404">На главную</a>
          <!--  <a href="/" class="btn-404 btn-ghost">Связаться с поддержкой</a>-->
        </div>
    </div>
</div>
<script src="../../static/notFound/script.js"></script>
</body>
</html>
