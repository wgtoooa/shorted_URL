<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1000px;
            height: 70%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border-radius: 16px;
            overflow: hidden;
            background: white;
        }

        .sidebar {
            width: 200px;
            background: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            background-color: #17a2b8;
            color: white;
            padding: 12px 20px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 8px;
            text-align: center;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .sidebar a:hover {
            background-color: #138496;
        }

        .content {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #343a40;
        }

        .content p {
            font-size: 1.2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <a href="/login">Sign In</a>
        <a href="/register">Register</a>
    </div>
    <div class="content">
        <h1>Welcome to LinkShorty</h1>
        <p>A simple and elegant way to shorten and manage your URLs.</p>
        <p>Create an account to get started, or sign in to view your dashboard.</p>
    </div>
</div>
</body>
</html>
