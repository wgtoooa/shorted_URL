services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"  # Пароль для Redis
      REDIS_DB: "${REDIS_DB:-0}"          # База данных (по умолчанию 0)
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15
    container_name: postgres-my
    env_file:
      - .env  # Можно вынести POSTGRES_* переменные сюда
    environment:
      POSTGRES_USER: "${DB_USER}"  # Подстановка из .env
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data: